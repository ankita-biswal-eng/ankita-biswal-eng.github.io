<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Biswal</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {
  background:#000;
  color:#fff;
  font-family:'Poppins', sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
}
.box {
  padding:60px 40px;
  border: 2px solid #FFD700;
  border-radius:20px;
  box-shadow: 0 0 50px rgba(255,215,0,0.3);
}
.hello {
  font-family:'Great Vibes', cursive;
  font-size:80px;
  color:#FFD700;
  margin-bottom:20px;
  animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
  from {text-shadow: 0 0 10px #FFD700;}
  to {text-shadow: 0 0 30px #FFD700, 0 0 50px #FFD700;}
}
.main-text {
  font-size:32px;
  font-weight:600;
  letter-spacing:2px;
  line-height:1.6;
}
.main-text span {
  color:#FFD700;
  font-weight:700;
}
@media(max-width:768px){
  .hello{font-size:60px;}
  .main-text{font-size:22px;}
  .box{padding:40px 20px; margin:20px;}
}
</style>
</head>
<body>
  <div class="box">
    <div class="hello">hello</div>
    <div class="main-text">
      I AM <span>ANKITA BISWAL</span> <br>
      WELCOME TO MY PROFILE
    </div>
  </div>
</body>
</html>
