<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Biswal - Portfolio</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        text-align: center;
    }
    .container {
        animation: fadeIn 1.5s ease-in;
    }
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .profile-card {
        width: auto;
        height: auto;
        background: transparent;
        box-shadow: none;
        filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6)); /* shape me glow */
        margin-bottom: 30px;
        animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }
    .profile-img {
        width: 300px;
        height: auto;
        border-radius: 0; /* koi box nahi */
    }
    h1 {
        font-size: 2.5em;
        background: linear-gradient(90deg, #ffd700, #ff8c00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }
    p {
        font-size: 1.2em;
        color: #ddd;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <img src="me.png" alt="Ankita Biswal" class="profile-img">
        </div>
        <h1>Ankita Biswal</h1>
        <p>Welcome to my Portfolio ✨</p>
    </div>
</body>
</html>
