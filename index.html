<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Biswal | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Poppins,sans-serif;
}

.hero{
width:100%;
height:100vh;
background:radial-gradient(circle at 70% 50%,rgba(255,215,0,.15) 0%,rgba(0,0,0,1) 60%);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 8%;
position:relative;
}

.hero::before{
content:'';
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="10" cy="10" r="1" fill="%23FFD700" opacity="0.1"/></svg>');
opacity:.3;
}

.left{
z-index:2;
width:50%;
color:white;
}

.left .hello{
font-family:"Great Vibes",cursive;
font-size:60px;
color:#FFD700;
display:flex;
align-items:center;
gap:10px;
}

.left .hello i{
font-size:20px;
}

.left h4{
font-size:16px;
font-weight:300;
letter-spacing:3px;
color:#ccc;
margin-top:-10px;
}

.left h1{
font-size:65px;
font-weight:600;
color:#FFD700;
margin:10px 0;
letter-spacing:1px;
}

.left p{
font-size:14px;
letter-spacing:4px;
color:#aaa;
margin-bottom:30px;
}

.icons{
display:flex;
gap:25px;
margin-top:20px;
}

.icons i{
font-size:22px;
color:#FFD700;
border:1px solid rgba(255,215,0,.3);
padding:12px;
border-radius:8px;
transition:.3s;
cursor:pointer;
}

.icons i:hover{
background:#FFD700;
color:#000;
transform:translateY(-5px);
}

.right{
z-index:2;
width:45%;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.right::before{
content:'';
position:absolute;
width:420px;
height:420px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,215,0,.4) 0%,transparent 70%);
filter:blur(40px);
z-index:0;
}

.photo{
width:380px;
height:480px;
border-radius:20px;
object-fit:cover;
z-index:1;
box-shadow:0 0 50px rgba(255,215,0,.2);
}

.leaf{
position:absolute;
width:120px;
opacity:.2;
}
.leaf1{top:10%; left:5%; transform:rotate(-20deg);}
.leaf2{bottom:15%; right:8%; transform:rotate(160deg) scaleX(-1);}

@media(max-width:900px){
.hero{flex-direction:column; padding:40px 20px;}
.left{width:100%; text-align:center;}
.right{width:100%; margin-top:30px;}
.photo{width:280px; height:350px;}
.left h1{font-size:45px;}
}
</style>
</head>

<body>

<div class="hero">

<img src="leaf.png" class="leaf leaf1">
<img src="leaf.png" class="leaf leaf2">

<div class="left">
<div class="hello">hello <i class="fa-solid fa-heart"></i></div>
<h4>I AM</h4>
<h1>Ankita Biswal</h1>
<p>WELCOME TO MY PROFILE</p>

<div class="icons">
<i class="fa-solid fa-code"></i>
<i class="fa-solid fa-laptop"></i>
<i class="fa-solid fa-lightbulb"></i>
<i class="fa-brands fa-github"></i>
</div>

</div>

<div class="right">
<!-- Apni professional photo yahan lagao -->
<img src="ankita.jpg" alt="Ankita Biswal" class="photo">
</div>

</div>

</body>
</html>
