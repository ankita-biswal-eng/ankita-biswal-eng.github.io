<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Biswal | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background: #0a0a0a;
    color:#fff;
    font-family: 'Poppins', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
}
.container{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 8%;
    height:100vh;
    background: radial-gradient(circle at 70% 50%, rgba(255,215,0,0.15) 0%, transparent 50%);
}
.left{
    flex:1;
    animation: slideInLeft 1.2s ease;
}
.right{
    flex:1;
    display:flex;
    justify-content:center;
    animation: slideInRight 1.2s ease;
}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
.hello{
    font-family: 'Great Vibes', cursive;
    font-size: 4em;
    color: #d4af37;
    animation: fadeIn 2s ease;
}
.name{
    font-family: 'Playfair Display', serif;
    font-size: 3.5em;
    background: linear-gradient(90deg, #d4af37, #f5e6a5, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.welcome{
    letter-spacing: 3px;
    color:#aaa;
    margin: 10px 0 30px 0;
    font-size:1.1em
}
img{
    width: 380px;
    height: 500px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(212,175,55,0.4);
    border: 2px solid rgba(212,175,55,0.3);
    animation: glow 3s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 50px rgba(212,175,55,0.4)}50%{box-shadow:0 0 80px rgba(212,175,55,0.7)}}
.social a{
    display:inline-block;
    margin-right:15px;
    padding:10px 20px;
    border:1px solid #d4af37;
    border-radius:50px;
    color:#d4af37;
    text-decoration:none;
    transition:0.3s;
    font-weight:500;
}
.social a:hover{background:#d4af37;color:#000;transform:translateY(-3px)}
.sparkle{
    position:absolute;
    width:4px;
    height:4px;
    background:#d4af37;
    border-radius:50%;
    animation: sparkle 3s infinite;
}
@keyframes sparkle{0%,100%{opacity:0}50%{opacity:1}}
@media(max-width:900px){
    .container{flex-direction:column;padding:40px 20px}
    img{width:280px;height:380px}
    .name{font-size:2.5em}
}
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <div class="hello">Hello,</div>
        <div>I'm</div>
        <div class="name">Ankita Biswal</div>
        <div class="welcome">WELCOME TO MY PROFILE</div>
        
        <div class="social">
            <a href="https://github.com">GitHub</a>
            <a href="https://linkedin.com">LinkedIn</a>
            <a href="mailto:">Email</a>
        </div>
    </div>
    <div class="right">
        <img src="me.png" alt="Ankita Biswal">
    </div>
</div>

<script>
// golden sparkles animation
for(let i=0;i<30;i++){
    let s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = Math.random()*3+'s';
    document.body.appendChild(s);
}
</script>
</body>
</html>
