<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankita Biswal | Portfolio</title>
<style>
    * { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body {
    background: #0d001a;
    color: white;
    overflow-x: hidden;
    position: relative;
  }
  
  body::before {
    content: '< /> Python HTML CSS JavaScript React />';
    position: absolute;
    font-size: 2rem;
    color: rgba(168, 85, 247, 0.08);
    animation: codeScroll 25s linear infinite;
    white-space: nowrap;
    top: 25%;
    left: 0;
  }
  @keyframes codeScroll {
    from { transform: translateX(-100%); } 
    to { transform: translateX(100%); }
  }

  .hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 3.5rem;
    background: linear-gradient(90deg, #a855f7, #ec4899, #a855f7);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 4s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes gradientShift { to { background-position: 200%; }

  .typing-text {
    font-size: 1.4rem;
    color: #c4b5fd;
    margin: 15px 0 30px;
    border-right: 3px solid #a855f7;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 3.5s steps(45) 1s forwards, blink 0.8s step-end infinite;
  }
  @keyframes typing { to { width: 100%; }
  @keyframes blink { 50% { border-color: transparent; } }

  .photo-wrap {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 30px auto;
  }
  .photo-wrap::before, .photo-wrap::after {
    content: '';
    position: absolute;
    border: 2px dashed #a855f7;
    border-radius: 50%;
    animation: rotate 12s linear infinite;
  }
  .photo-wrap::before { width: 100%; height: 100%; }
  .photo-wrap::after { width: 115%; height: 115%; top: -7.5%; left: -7.5%; animation-direction: reverse; }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 25px;
    box-shadow: 0 0 60px rgba(168, 85, 247, 0.6);
    position: relative;
    z-index: 2;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

  .btn {
    padding: 14px 35px;
    background: linear-gradient(90deg, #a855f7, #ec4899);
    color: white;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
    transition: 0.3s;
    opacity: 0;
    animation: fadeIn 1s 4.5s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .btn:hover { transform: scale(1.08); box-shadow: 0 0 30px #a855f7; }
</style>
</head>
<body>

<section class="hero">
  <h1>Ankita Biswal</h1>
  <p class="typing-text">Hi! Welcome to my portfolio. I build cool things ✨</p>
  
  <div class="photo-wrap">
    <img src="me.png" alt="Ankita with laptop">
  </div>
  
  <a href="#about" class="btn">Explore My Work</a>
</section>

</body>
</html>
